name: manus-ai

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-manus_db}
      POSTGRES_USER: ${POSTGRES_USER:-manus_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://$${POSTGRES_USER:-manus_user}:$${POSTGRES_PASSWORD:-change-me-in-production}@postgres:5432/$${POSTGRES_DB:-manus_db}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: $${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      CORS_ORIGINS: $${CORS_ORIGINS:-http://localhost:8080}
      ALLOWED_HOSTS: $${ALLOWED_HOSTS:-localhost,127.0.0.1}
      DEBUG: $${DEBUG:-false}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - app_data:/workspace/data
      - app_logs:/workspace/logs
      - app_workspace:/workspace/workspace
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    depends_on:
      backend: { condition: service_healthy }
    ports:
      - "${FRONTEND_PORT:-8080}:8080"

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      backend: { condition: service_healthy }
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: $${GRAFANA_ADMIN_PASSWORD:-change-me-in-production}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus: { condition: service_started }
    ports:
      - "${GRAFANA_PORT:-3001}:3000"

volumes:
  postgres_data:
  redis_data:
  app_data:
  app_logs:
  app_workspace:
  prometheus_data:
  grafana_data:
