name: Windows Desktop Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub Release after signing"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  AURORA_FRONTEND_DIR: ${{ github.workspace }}/frontend

jobs:
  validate:
    name: Validate source and frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio httpx pyinstaller

      - name: Compile and test backend
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/aurora-relay-tests.db
          AURORA_DATA_DIR: ${{ runner.temp }}/aurora-relay-test-data
          AURORA_CONFIG_DIR: ${{ runner.temp }}/aurora-relay-test-config
          AURORA_LOGS_DIR: ${{ runner.temp }}/aurora-relay-test-logs
          AURORA_TEST_DB: ${{ runner.temp }}/aurora-relay-test-databases/phase8_test.db
          AURORA_TEST_API_DB: ${{ runner.temp }}/aurora-relay-test-databases/test_api.db
          JWT_SECRET_KEY: test-only-jwt-secret-not-for-production-0123456789-abcdef-0123456789
        run: |
          python -m compileall -q backend mcp_servers
          mkdir -p "$AURORA_DATA_DIR" "$AURORA_CONFIG_DIR" "$AURORA_LOGS_DIR" "$(dirname "$AURORA_TEST_DB")" "$(dirname "$AURORA_TEST_API_DB")"
          PYTHONPATH=backend pytest -q tests backend/tests
      - name: Set up pnpm and Node.js
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Validate frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm validate

  build-sign-release:
    name: Build and sign Windows installers
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish == true
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Set up pnpm and Node.js
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend build dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build unsigned Windows installer
        shell: bash
        env:
          FRONTEND_DIR: ${{ github.workspace }}/frontend
          PYTHON: python
        run: |
          bash desktop/scripts/build-all.sh win

      - name: Provision Windows SDK signing tools
        shell: pwsh
        run: |
          $sdkRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $signtool = if (Test-Path $sdkRoot) {
            Get-ChildItem -Path $sdkRoot -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.Directory.Name -eq 'x64' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1
          }
          if ($null -eq $signtool) {
            choco install windows-sdk-10.0 --yes --no-progress --limit-output
            $signtool = Get-ChildItem -Path $sdkRoot -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.Directory.Name -eq 'x64' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1
          }
          if ($null -eq $signtool) {
            throw 'signtool.exe was not available after Windows SDK provisioning.'
          }
          "AURORA_SIGNTOOL_PATH=$($signtool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Sign Windows artifacts
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
          AURORA_INTERNAL_SIGNING_CERT_SHA1: ${{ vars.AURORA_INTERNAL_SIGNING_CERT_SHA1 }}
          AURORA_SIGNTOOL_PATH: ${{ env.AURORA_SIGNTOOL_PATH }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_PASSWORD)) {
            throw 'Release environment signing secrets are not configured. Refusing to publish unsigned Windows artifacts.'
          }
          if ([string]::IsNullOrWhiteSpace($env:AURORA_INTERNAL_SIGNING_CERT_SHA1)) {
            throw 'The internal signing certificate thumbprint is not configured. Refusing to publish an unverifiable internal signature.'
          }
          ./desktop/scripts/sign-windows.ps1 `
            -ReleaseDirectory desktop/release `
            -PfxBase64 $env:WINDOWS_SIGNING_PFX_BASE64 `
            -PfxPassword $env:WINDOWS_SIGNING_PFX_PASSWORD `
            -TimestampUrl $env:WINDOWS_TIMESTAMP_URL

      - name: Generate checksums
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem desktop/release -Filter '*.exe' -File)
          if ($installers.Count -eq 0) {
            throw 'No Windows installer executables were available for checksums.'
          }
          $installers |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $($_.Path | Split-Path -Leaf)" } |
            Set-Content -Encoding ascii desktop/release/SHA256SUMS

      - name: Generate deterministic provenance manifest
        shell: pwsh
        run: |
          $artifacts = @(Get-ChildItem desktop/release -Filter '*.exe' -File |
            Sort-Object Name |
            ForEach-Object {
              [ordered]@{
                name = $_.Name
                sha256 = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              }
            })
          if ($artifacts.Count -eq 0) {
            throw 'No Windows installer executables were available for the provenance manifest.'
          }
          $manifest = [ordered]@{
            schema = 'aurora-relay-release-provenance/v1'
            repository = $env:GITHUB_REPOSITORY
            ref = $env:GITHUB_REF
            revision = $env:GITHUB_SHA
            workflow = $env:GITHUB_WORKFLOW
            run = [ordered]@{
              id = $env:GITHUB_RUN_ID
              attempt = $env:GITHUB_RUN_ATTEMPT
              url = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            }
            generated_at_utc = (Get-Date).ToUniversalTime().ToString('o')
            artifacts = $artifacts
            github_artifact_attestation = [ordered]@{
              attempted = $true
              note = 'GitHub artifact attestations are an additional platform-dependent claim; inspect the workflow summary for availability.'
            }
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 desktop/release/provenance.json

      - name: Attempt GitHub provenance attestation
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: desktop/release/*.exe

      - name: Verify installer on clean Windows runner
        shell: pwsh
        env:
          AURORA_INTERNAL_SIGNING_CERT_SHA1: ${{ vars.AURORA_INTERNAL_SIGNING_CERT_SHA1 }}
        run: |
          $installers = @(Get-ChildItem desktop/release -Filter '*.exe' -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows installer for clean-machine verification, found $($installers.Count)."
          }
          $expectedHash = ((Get-Content desktop/release/SHA256SUMS | Where-Object { $_ -match '\.exe$' } | Select-Object -First 1) -split '\s+')[0]
          if ([string]::IsNullOrWhiteSpace($expectedHash)) {
            throw 'The installer SHA-256 entry was not found in SHA256SUMS.'
          }
          ./desktop/scripts/verify-windows-clean-machine.ps1 `
            -InstallerPath $installers[0].FullName `
            -ExpectedSha256 $expectedHash `
            -ExpectedSignerThumbprint $env:AURORA_INTERNAL_SIGNING_CERT_SHA1 `
            -EvidencePath desktop/release/clean-machine-evidence.json

      - name: Upload clean-machine evidence on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurora-relay-clean-machine-evidence-${{ github.sha }}
          path: |
            desktop/release/clean-machine-evidence.json
            desktop/release/clean-machine-backend.log
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aurora-relay-windows-${{ github.sha }}
          path: |
            desktop/release/*.exe
            desktop/release/*.blockmap
            desktop/release/SHA256SUMS
            desktop/release/provenance.json
            desktop/release/clean-machine-evidence.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish == true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF_NAME } else { "build-$env:GITHUB_RUN_NUMBER" }
          $releaseArgs = @($tag, 'desktop/release/*.exe', 'desktop/release/SHA256SUMS', 'desktop/release/provenance.json', 'desktop/release/clean-machine-evidence.json', '--generate-notes')
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $releaseArgs += '--verify-tag'
          }
          gh release create @releaseArgs
