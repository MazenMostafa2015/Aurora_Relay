<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" />
    <title>Aurora Relay</title>
    <style>
      :root { color: #f1f5f9; background: #09111f; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: radial-gradient(circle at 20% 20%, #123d56 0%, #09111f 42%); }
      main { width: min(38rem, calc(100% - 3rem)); padding: 2.5rem; border: 1px solid #29445d; background: rgba(9, 17, 31, 0.92); }
      .eyebrow { margin: 0 0 .75rem; color: #5eead4; font-size: .78rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(2rem, 5vw, 3.5rem); }
      p { color: #cbd5e1; line-height: 1.6; }
      #status { display: inline-flex; align-items: center; gap: .6rem; margin-top: 1.25rem; padding: .65rem .85rem; color: #dbeafe; background: #102238; }
      #dot { width: .7rem; height: .7rem; background: #fbbf24; border-radius: 50%; }
      .ready #dot { background: #5eead4; }
      .failed #dot { background: #fb7185; }
      code { color: #e2e8f0; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Aurora Relay Desktop</p>
      <h1>Starting the local workspace</h1>
      <p id="detail">The local service is starting. This page does not transmit diagnostics or load third-party content.</p>
      <div id="status" aria-live="polite"><span id="dot" aria-hidden="true"></span><span>Checking local service…</span></div>
    </main>
    <script src="/assets/desktop-fallback.js" defer></script>
  </body>
</html>
