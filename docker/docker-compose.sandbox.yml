services:
  sandbox-python:
    build:
      context: .
      dockerfile: sandbox/Dockerfile.python
    profiles: [sandbox-images]
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=100m
    command: ["sleep", "infinity"]

  sandbox-node:
    build:
      context: .
      dockerfile: sandbox/Dockerfile.node
    profiles: [sandbox-images]
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=100m
    command: ["sleep", "infinity"]
